services:
  ollama:
    image: ${OLLAMA_IMAGE:?Set OLLAMA_IMAGE to an approved pinned tag or digest}
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - inteli_private
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  inteli_private:
    internal: true

volumes:
  ollama_models:
