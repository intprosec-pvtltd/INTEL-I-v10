apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: intel-i
  labels:
    app: postgres-data
    app.kubernetes.io/part-of: intel-i
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: intel-i-local
  volumeName: intel-i-postgres
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: intel-i
  labels:
    app: postgres
    app.kubernetes.io/part-of: intel-i
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/part-of: intel-i
    spec:
      nodeSelector:
        intel-i/node: single-l40s
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: postgres
        image: postgis/postgis:16-3.5-alpine
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_DB
          value: cctv_db
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: intel-i-secrets
              key: POSTGRES_PASSWORD
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - sh
            - -ec
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        startupProbe:
          exec:
            command:
            - sh
            - -ec
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-data
      enableServiceLinks: false
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: intel-i
  labels:
    app: postgres
    app.kubernetes.io/part-of: intel-i
spec:
  selector:
    app: postgres
  ports:
  - name: internal
    port: 5432
    targetPort: 5432
---
