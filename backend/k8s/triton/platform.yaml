apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-worker
  namespace: intel-i
  labels:
    app: inference-worker
    app.kubernetes.io/part-of: intel-i
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: inference-worker
  template:
    metadata:
      labels:
        app: inference-worker
        app.kubernetes.io/part-of: intel-i
    spec:
      nodeSelector:
        intel-i/node: single-l40s
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: inference-worker
        image: intel-i-runtime:triton-v1
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - workers.inference_worker
        envFrom:
        - configMapRef:
            name: intel-i-config
        - secretRef:
            name: intel-i-secrets
        env:
        - name: INTEL_I_PROCESS_ROLE
          value: inference-worker
        - name: INFERENCE_GPU_REQUIRED
          value: 'false'
        - name: CUDA_VISIBLE_DEVICES
          value: ''
        - name: NVIDIA_VISIBLE_DEVICES
          value: void
        ports:
        - name: http
          containerPort: 9300
        resources:
          requests:
            cpu: '2'
            memory: 4Gi
          limits:
            cpu: '8'
            memory: 24Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      enableServiceLinks: false
---
apiVersion: v1
kind: Service
metadata:
  name: inference-worker
  namespace: intel-i
  labels:
    app: inference-worker
    app.kubernetes.io/part-of: intel-i
spec:
  selector:
    app: inference-worker
  ports:
  - name: http
    port: 9300
    targetPort: http
---
apiVersion: v1
kind: Namespace
metadata:
  name: intel-i
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: intel-i-config
  namespace: intel-i
  labels:
    app: intel-i-config
    app.kubernetes.io/part-of: intel-i
data:
  CENTRAL_INFERENCE_ENABLED: 'true'
  INFERENCE_PROCESS_SPLIT_ENABLED: 'true'
  AI_BATCHING_ENABLED: 'true'
  INFERENCE_SERVICE_URL: http://inference-worker:9300
  CAMERA_SOURCE_FPS: '25'
  PREVIEW_FPS: '12'
  IDLE_DETECTION_FPS: '2'
  ACTIVE_DETECTION_FPS: '5'
  INCIDENT_DETECTION_FPS: '8'
  CRITICAL_DETECTION_FPS: '10'
  TENSORRT_ENABLED: 'false'
  TENSORRT_PRECISION: fp16
  PRIMARY_DETECTOR_TENSORRT_ENGINE: ''
  GPU_PREPROCESSING_ENABLED: 'false'
  CAMERA_LOAD_BALANCING_ENABLED: 'true'
  INFERENCE_PRIORITY_AGING_SECONDS: '2'
  INFERENCE_MAX_FRAME_BYTES: '8388608'
  INFERENCE_REQUIRE_INTERNAL_TOKEN: 'true'
  FRS_FULL_FRAME_FALLBACK_ENABLED: 'false'
  DARKIR_PRIMARY_DETECTION_ENABLED: 'false'
  TRACK_CACHE_TTL_SECONDS: '30'
  TRACK_CACHE_QUALITY_IMPROVEMENT: '0.08'
  BEHAVIOUR_FPS: '3'
  FRS_MAX_FPS: '2'
  ANPR_MAX_FPS: '3'
  REID_INTERVAL_SECONDS: '2'
  INFERENCE_BATCH_SIZE: '16'
  INFERENCE_BATCH_WAIT_MS: '20'
  CAMERA_FRAME_QUEUE_SIZE: '2'
  GPU_QUEUE_MAX_SIZE: '100'
  VIDEO_HW_DECODE_ENABLED: 'false'
  VIDEO_DECODE_DEVICE: auto
  ADAPTIVE_FPS_ENABLED: 'true'
  PRIORITY_INFERENCE_ENABLED: 'true'
  INFERENCE_BACKPRESSURE_ENABLED: 'true'
  ENV: prod
  INTEL_I_DISTRIBUTED_CAMERA_WORKERS: 'true'
  INTEL_I_MAX_CAMERAS_PER_WORKER: '10'
  POSTGRES_HOST: postgres
  POSTGRES_PORT: '5432'
  POSTGRES_DB: cctv_db
  POSTGRES_USER: postgres
  REDIS_ENABLED: 'true'
  REDIS_URL: redis://redis:6379/0
  KAFKA_ENABLED: 'true'
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  OBJECT_STORAGE_BACKEND: minio
  OBJECT_STORAGE_REQUIRED: 'true'
  OBJECT_STORAGE_ALLOW_LOCAL_FALLBACK: 'false'
  OBJECT_STORAGE_CACHE_DIR: /app/object-cache
  MINIO_ENDPOINT: minio:9000
  MINIO_VIDEO_BUCKET: intel-i-uploaded-videos
  MINIO_SECURE: 'false'
  ANPR_OCR_REMOTE_URL: http://anpr-worker:9201
  FRS_REMOTE_URL: http://frs-worker:9202
  ANPR_REQUIRED: 'true'
  FRS_REQUIRED: 'true'
  FRS_WATCHLIST_SYNC_SECONDS: '15'
  FRS_REQUEST_TIMEOUT_SECONDS: '3'
  FRS_FAILURE_THRESHOLD: '3'
  FRS_RECOVERY_SECONDS: '10'
  FRS_MATCH_THRESHOLD: '0.55'
  FRS_CONFIRMATIONS_REQUIRED: '3'
  FRS_CONFIRMATION_WINDOW_SECONDS: '5'
  FACE_DETECTOR_MODEL_PATH: /app/models/face_detection_yunet_2023mar.onnx
  FACE_RECOGNIZER_MODEL_PATH: /app/models/face_recognition_sface_2021dec.onnx
  ANPR_OCR_ENGINE: awiros_paddle
  ANPR_AWIROS_MODEL_PATH: /app/models/awiros_anpr_ocr/model.safetensors
  ANPR_AWIROS_DICT_PATH: /app/models/awiros_anpr_ocr/en_dict.txt
  ANPR_AWIROS_PADDLEOCR_DIR: /app/vendor/PaddleOCR
  PYTHONUNBUFFERED: '1'
  INTEL_I_INFERENCE_MODE: triton
  INTEL_I_TRITON_GRPC_URL: triton:8001
  INFERENCE_FRAME_TTL_MS: '500'
  INFERENCE_BATCH_FALLBACK_ENABLED: 'false'
  INFERENCE_GPU_REQUIRED: 'false'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: intel-i-probes
  namespace: intel-i
  labels:
    app: intel-i-probes
    app.kubernetes.io/part-of: intel-i
data:
  check-health.py: "import json, sys\ntry:\n    data = json.load(sys.stdin)\n    ready\
    \ = str(data.get(\"status\", \"\")).upper() == \"READY\"\nexcept (ValueError,\
    \ TypeError, AttributeError):\n    ready = False\nsys.exit(0 if ready else 1)\n"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: intel-i-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: intel-i-postgres
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: intel-i-local
  local:
    path: /var/lib/intel-i/postgres
  claimRef:
    namespace: intel-i
    name: postgres-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: intel-i/node
          operator: In
          values:
          - single-l40s
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: intel-i-redis
spec:
  capacity:
