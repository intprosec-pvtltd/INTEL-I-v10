apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: intel-i
  labels:
    app: default-deny-ingress
    app.kubernetes.io/part-of: intel-i
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  namespace: intel-i
  labels:
    app: allow-postgres
    app.kubernetes.io/part-of: intel-i
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: intel-i-api
    - podSelector:
        matchLabels:
          app: camera-worker
    - podSelector:
        matchLabels:
          app: frs-worker
    - podSelector:
        matchLabels:
          app: camera-onboarding-worker
    - podSelector:
        matchLabels:
          app: intel-i-migrate
    - podSelector:
        matchLabels:
          app: intel-i-diagnostics
    - podSelector:
        matchLabels:
          app: inference-worker
    ports:
    - protocol: TCP
      port: 5432
---
