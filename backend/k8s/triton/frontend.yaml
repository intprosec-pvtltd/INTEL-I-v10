apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: intel-i
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend, app.kubernetes.io/part-of: intel-i}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: intel-i-frontend:triton-v1
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: '1', memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: ['ALL']}
          readinessProbe:
            httpGet: {path: /health, port: http}
          livenessProbe:
            httpGet: {path: /health, port: http}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: intel-i
spec:
  selector: {app: frontend}
  ports: [{port: 8080, targetPort: http}]
